# Karpenter NodePool and EC2NodeClass for v0.37.0
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  role: myapp-dev-karpenter-node
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: myapp-dev-cluster
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: myapp-dev-cluster
  tags:
    Name: myapp-dev-karpenter-node
---
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.medium", "t3.large", "t3a.medium", "t3a.large"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
  limits:
    cpu: "10"
    memory: 40Gi
  disruption:
    consolidationPolicy: WhenUnderutilized
